<dialog id="price-dialog" aria-labelledby="price-title">
  <div class="dialog-heading"><h2 id="price-title">Получить оптовый прайс</h2><button type="button" id="price-close" aria-label="Закрыть">×</button></div>
  <form id="price-form" data-endpoint="https://script.google.com/macros/s/AKfycbwor6CdpydbUJsB78bTnwQuY1j5D9VyRWQWha1eDrmGeXYgUEIaO7fs21XstsTAToIZHw/exec">
    <p>Пришлём вам прайс в течение двух минут на указанную почту.</p>
    <label for="price-email">Email</label><input id="price-email" name="email" autocomplete="email" type="email" maxlength="254" required>
    <label for="price-region">Регион (необязательно)</label><input id="price-region" name="region" autocomplete="address-level1" maxlength="100">
    <button class="primary" type="submit">Получить прайс</button>
  </form>
  <div class="mail-flight" hidden>
    <svg viewBox="0 0 400 183" aria-hidden="true">
     <path id="trail" d=""/>
     <g id="factory" transform="translate(21 78)">
      <rect class="glyph" x="5" y="32" width="79" height="47" rx="7"/>
      <path class="glyph" d="M15 32V24q0-5 5-5h18q5 0 5 5v8M57 32V9q0-5 5-5h10q5 0 5 5v23"/>
      <path d="M61 13h13M0 79h89"/>
      <rect x="16" y="44" width="14" height="11" rx="2"/><rect x="36" y="44" width="14" height="11" rx="2"/>
      <rect x="16" y="61" width="14" height="8" rx="2"/><rect x="36" y="61" width="14" height="8" rx="2"/>
      <rect x="58" y="48" width="17" height="17" rx="3"/>
     </g>
     <g id="people" transform="translate(303 81)">
      <circle class="glyph" cx="38" cy="12" r="9"/>
      <path d="M23 34v-2a10 10 0 0 1 10-10h10a10 10 0 0 1 10 10v2"/>
      <circle class="glyph arrival" cx="18" cy="43" r="9"/>
      <circle class="glyph arrival" cx="58" cy="43" r="9"/>
      <path d="M4 72v-8a10 10 0 0 1 10-10h8a10 10 0 0 1 10 10v8m12 0v-8a10 10 0 0 1 10-10h8a10 10 0 0 1 10 10v8"/>
     </g>
     <g id="envelope" opacity="0"><rect x="-15" y="-10" width="30" height="20" rx="3"/><path d="m-14-7 14 10 14-10m-28 15 9-7m19 7-9-7"/></g>
    </svg>
    </div>
  <p id="price-status" role="status"></p>
  <button class="primary" id="price-done" type="button" hidden>Закрыть</button>
</dialog>
