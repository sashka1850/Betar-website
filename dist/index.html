<div class="page">

   <button class="header-quote" data-quote><svg><use href="#mail"/></svg>Запрос на опт</button>

 </header>
 <main class="hero" id="overview" aria-labelledby="title">

  </div>
  <div class="copy-zone"><div class="copy-inner">

  </div></div>

 <nav class="categories" aria-label="Выбор типа счётчика">

  <button class="category" data-type="gas" aria-pressed="false" aria-controls="overview"><svg class="category-icon"><use href="#gas"/></svg><span>Газ</span><svg class="end"><use href="#arrow"/></svg></button>

 </nav>
</div>
<dialog id="info" aria-labelledby="info-heading"><div class="dialog-heading"><h2 id="info-heading"></h2><button data-close aria-label="Закрыть"><svg><use href="#close"/></svg></button></div><p id="info-body"></p><button class="primary" data-quote>Подготовить запрос</button></dialog>
<dialog id="quote" aria-labelledby="quote-heading"><div class="dialog-heading"><h2 id="quote-heading">Запрос на опт</h2><button data-close aria-label="Закрыть"><svg><use href="#close"/></svg></button></div><p>Подготовьте текст запроса для отдела продаж.</p><label for="draft">Текст запроса</label><textarea id="draft" rows="5"></textarea><button class="primary" id="copy-draft">Скопировать запрос</button><p id="status" role="status"></p></dialog>
